<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rytm – Smart Event Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#141B26; --ink2:#5B6675; --line:#E0E5EC;
  --accent:#3345D6; --accent-soft:#E7EAFD; --on-accent:#FFFFFF;
  --task:#2C7A63; --task-soft:#E1F1EB;
  --warn:#9A5B00; --warn-soft:#FBF0DA; --bad:#B8332B; --bad-soft:#FBE6E4;
  --shadow:0 1px 2px rgba(20,27,38,.05),0 6px 18px rgba(20,27,38,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D121A; --surface:#161D28; --ink:#EDF0F5; --ink2:#9AA5B5; --line:#263040;
    --accent:#93A0FF; --accent-soft:#222B58; --on-accent:#0E1338;
    --task:#6FCFAB; --task-soft:#173329;
    --warn:#F0B252; --warn-soft:#3A2C10; --bad:#FF8F86; --bad-soft:#3D1D1B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121A; --surface:#161D28; --ink:#EDF0F5; --ink2:#9AA5B5; --line:#263040;
  --accent:#93A0FF; --accent-soft:#222B58; --on-accent:#0E1338;
  --task:#6FCFAB; --task-soft:#173329;
  --warn:#F0B252; --warn-soft:#3A2C10; --bad:#FF8F86; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:22px 20px 130px}

/* header */
.hd{margin-bottom:14px}
.greet{color:var(--ink2);font-size:15px}
h1{font-size:30px;line-height:1.1;font-weight:650;letter-spacing:-.025em;margin-top:2px}
h2{font-size:20px;font-weight:650;letter-spacing:-.015em}
h3{font-size:15px;font-weight:600}
.brief{font-size:22px;line-height:1.28;font-weight:500;letter-spacing:-.012em;margin:8px 0 22px}
.brief.sm{font-size:17px;margin:12px 0 18px;color:var(--ink2);font-weight:450}
.sec{margin:30px 0 12px}

/* rail */
.rail{position:relative;padding-left:64px}
.rail::before{content:'';position:absolute;left:52px;top:8px;bottom:8px;border-left:2px dotted var(--line)}
.row{position:relative;margin-bottom:10px;cursor:pointer}
.row .tm{position:absolute;left:-64px;top:14px;width:44px;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .dotp{position:absolute;left:-16px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.row.tk .dotp{background:var(--task)}
.row.cf .dotp{background:var(--bad)}
.card{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:3px solid var(--accent)}
.row.tk .card{background:var(--task-soft);box-shadow:none;border-left-color:var(--task);display:flex;gap:12px;align-items:flex-start}
.row.cf .card{border-left-color:var(--bad)}
.row.done .ttl{text-decoration:line-through;color:var(--ink2)}
.ttl{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;color:var(--ink2);font-size:14px}
.loc{display:inline-flex;align-items:center;gap:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.task{background:var(--task-soft);color:var(--task)}
.gap{position:relative;margin:2px 0 12px;font-size:13px;color:var(--ink2);padding:2px 0}
.now{position:relative;height:0;margin:8px 0 12px}
.now::before{content:'';position:absolute;left:-12px;right:0;top:0;border-top:2px solid var(--accent)}
.now span{position:absolute;left:-64px;top:-10px;width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--task);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px;color:var(--on-accent)}
.done .chk{background:var(--task)}
.empty{padding:34px 8px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* alerts and cards */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert p{font-size:14.5px;line-height:1.35;color:var(--ink)}
.alert b{font-size:13px}
.welcome{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px;margin-bottom:22px}
.welcome h2{font-size:22px;letter-spacing:-.02em}
.welcome p{margin:6px 0 16px;opacity:.92;font-size:15.5px}
.welcome .btn{background:var(--on-accent);color:var(--accent)}
.welcome .btn.ghost{background:transparent;color:var(--on-accent);opacity:.85}
.prep{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.prep-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prep .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--task);border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 14px;font-size:14px;color:var(--ink2);margin-top:26px}

/* buttons */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;line-height:1.2;background:var(--bg);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .primary{flex:1 1 auto}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:3px 10px;font-size:12.5px}

/* calendar */
.cal-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 14px}
.navb{display:flex;gap:6px}
.iconb{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border:0;background:transparent;border-radius:14px;padding:8px 0 10px;display:grid;justify-items:center;gap:1px;color:var(--ink2);position:relative}
.wd span{font-size:12px}
.wd b{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.wd[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wd[aria-pressed="true"] b{color:var(--on-accent)}
.wd[data-today] b{color:var(--accent)}
.wd[data-today][aria-pressed="true"] b{color:var(--on-accent)}
.wd .ind{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0;margin-top:2px}
.wd .ind.on{opacity:1}
.wd[aria-pressed="true"] .ind{background:var(--on-accent)}
.wk{--px:42px;margin:6px -8px 0}
.wk-h,.wk-b{display:grid;grid-template-columns:30px repeat(7,1fr)}
.wkh{border:0;background:transparent;display:grid;justify-items:center;padding:4px 0 8px;color:var(--ink2)}
.wkh span{font-size:12px}
.wkh b{font-size:16px;color:var(--ink);width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wkh.today b{background:var(--accent);color:var(--on-accent)}
.wk-ax{position:relative}
.wk-ax span{position:absolute;right:4px;transform:translateY(-50%);font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.wkc{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--px) - 1px),var(--line) calc(var(--px) - 1px),var(--line) var(--px))}
.wkc.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.blk{position:absolute;left:2px;right:2px;border:0;border-radius:6px;padding:2px 4px;text-align:left;overflow:hidden;font-size:10.5px;line-height:1.15;background:var(--accent-soft);color:var(--accent);border-left:2px solid var(--accent)}
.blk.tk{background:var(--task-soft);color:var(--task);border-left-color:var(--task)}
.blk.cf{background:var(--bad-soft);color:var(--bad);border-left-color:var(--bad)}
.blk.done{opacity:.5}
.ag-day{margin-bottom:18px}
.ag-day h3{margin-bottom:6px}
.ag-row{display:grid;grid-template-columns:48px 1fr;gap:6px 10px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.ag-row .num{color:var(--ink2);font-size:14px}
.ag-row small{grid-column:2;color:var(--ink2);font-size:13px;margin-top:-4px}

/* tasks */
.qa{display:flex;gap:8px;margin:16px 0 22px}
.qa input{flex:1}
.tl{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.tl .main{flex:1;min-width:0;cursor:pointer}
.tl .sub{font-size:13.5px;color:var(--ink2);margin-top:1px}
.tl.done .ttl{text-decoration:line-through;color:var(--ink2)}
.tl.done{opacity:.7}

/* forms */
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
input:not([type=checkbox]),textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.field.need input{border-color:var(--bad);background:var(--bad-soft)}
.unsure{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:1px 8px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:4px 0 8px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(103%);transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet-in{max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{margin-bottom:4px}
.lead{color:var(--ink2);margin-bottom:16px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;color:var(--ink2);margin-bottom:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-width:100%;max-height:200px;border-radius:12px;display:block;margin:0 auto 12px}
.drop b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}
.sep{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;margin:6px 0 10px}
.sep::before,.sep::after{content:'';flex:1;border-top:1px solid var(--line)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.skel{display:grid;gap:10px;margin:18px 0}
.skel i{display:block;height:46px;border-radius:14px;background:linear-gradient(90deg,var(--bg),var(--line),var(--bg));background-size:200% 100%;animation:sh 1.4s linear infinite}
.skel i:nth-child(2){height:66px}
@keyframes sh{to{background-position:-200% 0}}

/* preview */
.pv{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.pv.off{opacity:.5}
.pv-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.tile{flex:none;width:52px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-content:center;text-align:center;line-height:1}
.tile b{font-size:22px;font-weight:700}
.tile span{font-size:12px;margin-top:3px}
.pv-main{flex:1;min-width:0;display:grid;gap:6px}
.pv-title{font-weight:650;font-size:18px !important;letter-spacing:-.01em}
.pv .inc{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.pv-warn{font-size:14px;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.pv-warn:empty{display:none}
.ev-src{font-size:13px;color:var(--ink2);margin-top:2px}
.qs{font-size:14.5px;color:var(--ink2);margin:0 0 14px;padding-left:18px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);list-style:none}
.pl span{display:block;color:var(--ink2);font-size:14px}
.pl .x{border:0;background:var(--bg);width:32px;height:32px;border-radius:10px;color:var(--ink2);font-size:18px;line-height:1}
ul.plain{margin:0;padding:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:64px}
.tab{background:none;border:0;color:var(--ink2);font-size:11.5px;font-weight:600;display:grid;justify-items:center;gap:3px;padding:6px 0}
.tab[aria-current="page"]{color:var(--accent)}
.plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;justify-self:center;display:grid;place-items:center;margin-top:-16px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s}
.plus:active{transform:scale(.94)}
.about{color:var(--ink2);font-size:14.5px;line-height:1.5}
.about p{margin-bottom:10px}
.grp{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.grp h3{margin-bottom:10px}
.grp .btn{margin-right:8px;margin-bottom:8px}
.ask{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;color:var(--ink2);box-shadow:var(--shadow);margin:0 0 20px}
.ask svg{flex:none;color:var(--accent)}
.hd-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.av.lg{width:48px;height:48px}
.who-row{display:flex;gap:12px;align-items:center}
.who-row .sub{font-size:14px;color:var(--ink2)}
.aibrief{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:14px 16px;margin:-6px 0 20px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.aibrief p{font-size:16px;line-height:1.4}
.ans{margin-top:16px;font-size:16.5px;line-height:1.45}
.ans p{margin-bottom:8px}
.chg{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.chg li{background:var(--task-soft);color:var(--task);border-radius:10px;padding:8px 10px;font-size:14.5px;font-weight:550}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.sug{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 12px;font-size:14px;color:var(--ink2)}
.askrow{display:flex;gap:8px}
.mic{flex:none;width:46px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mic.rec{background:var(--bad);color:#fff}
.prop{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.prop span{display:block;color:var(--ink2);font-size:14px}
select{appearance:auto}
.ic{flex:none;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;line-height:1}
.row.tk .ic{background:var(--surface)}
.top{display:flex;gap:10px;align-items:flex-start}
.top>div{min-width:0;flex:1}
.avb{border:0;background:none;padding:0;border-radius:50%;flex:none}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mapbox{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox.placing svg{cursor:crosshair}
.mapbox.placing .pin{pointer-events:none}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:18px;line-height:1;padding:0}
.maprect{fill:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.gridl{stroke:var(--line);stroke-width:1}
.pin{cursor:pointer}
.pin-c{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.pin.tk .pin-c{stroke:var(--task)}
.pin.guess .pin-c{stroke-dasharray:4 3}
.pin.home .pin-c{fill:var(--accent)}
.pin-i{font-size:18px}
.pin-n{fill:var(--accent)}
.pin.tk .pin-n{fill:var(--task)}
.pin-nt{fill:var(--on-accent);font-size:10px;font-weight:700}
.pin-l{font-size:12px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}

<script>
'use strict';
/*LOGIC-START*/
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dtf=(d,o)=>new Intl.DateTimeFormat('sv-SE',o).format(d);
const wdLong=d=>cap(dtf(d,{weekday:'long'}));
const wdShort=d=>cap(dtf(d,{weekday:'short'}).replace('.',''));
const monShort=d=>dtf(d,{month:'short'}).replace('.','');
const monLong=d=>dtf(d,{month:'long'});
const dayDiff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const startOfWeek=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`};
const relDay=ds=>{const n=dayDiff(ds,ymd(new Date()));return n===0?'idag':n===1?'imorgon':n===-1?'igår':n>1?`om ${n} dagar`:`för ${-n} dagar sedan`};
const shortDate=ds=>{const d=pd(ds);return `${wdShort(d)} ${d.getDate()} ${monShort(d)}`};

/* ---------- data ---------- */
const KEY='rytm.v1';
let state=null;
let cfCache=null;
function demoItems(){
  const t=new Date(); const D=n=>ymd(addDays(t,n));
  const SCH={lat:59.3385,lng:18.0900,geo:'demo'},KISTA={lat:59.4030,lng:17.9440,geo:'demo'},SATRA={lat:59.2840,lng:17.9200,geo:'demo'},ODEN={lat:59.3430,lng:18.0495,geo:'demo'};
  const ev=(n,title,start,end,location,extra={})=>({id:uid(),demo:true,title,date:D(n),start,end,location:location||'',notes:'',prep:[],travel:null,important:false,...extra});
  return [
    ev(0,'Svenska','08:15','09:45','Östra Real, sal 112',SCH),
    ev(0,'Lunch','12:00','12:45','Östra Real, matsalen',SCH),
    ev(0,'Fotbollsträning','18:00','19:30','Sätra IP',{...SATRA,prep:['Vattenflaska','Träningskläder']}),
    ev(1,'Tandläkare','15:30','16:15','Odenplan',ODEN),
    ev(2,'Grupparbete','16:30','17:45','Kista bibliotek',KISTA),
    ev(2,'Fotbollsträning','18:00','19:30','Sätra IP',SATRA),
    ev(4,'Fysikprov','08:15','09:15','Östra Real, sal 204',{...SCH,prep:['Kapitel 4','Kapitel 5','Kapitel 6'],important:true})
  ];
}
function freshState(){return {v:3,theme:'auto',seenWelcome:false,mode:'transit',home:demoHome(),events:demoItems(),tasks:[],trips:[demoTrip()]}}
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.events)&&Array.isArray(s.tasks))return migrate(s)}}catch(e){}
  return freshState();
}
function save(){cfCache=null;autoTravel(state);state.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(typeof scheduleSync==='function')scheduleSync()}

/* ---------- conflicts ---------- */
function blocksOf(events,tasks){
  const b=[];
  for(const e of events) if(e.date&&e.start&&e.end) b.push({kind:'event',id:e.id,title:e.title,date:e.date,s:toMin(e.start),e:toMin(e.end),loc:(e.location||'').trim().toLowerCase(),travel:+e.travel||0,lat:e.lat,lng:e.lng});
  for(const t of tasks) if(t.date&&t.start&&t.end&&!t.done) b.push({kind:'task',id:t.id,title:t.title,date:t.date,s:toMin(t.start),e:toMin(t.end),loc:'',travel:0});
  return b;
}
function detectConflicts(events,tasks){
  const byDay={};
  for(const b of blocksOf(events,tasks)) (byDay[b.date]=byDay[b.date]||[]).push(b);
  const out=[];
  for(const [date,list] of Object.entries(byDay)){
    list.sort((x,y)=>x.s-y.s||x.e-y.e);
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i],b=list[j];
        if(b.s>=a.e) break;
        out.push({type:'overlap',date,a,b,text:`${a.title} och ${b.title} överlappar (${fromMin(Math.max(a.s,b.s))}–${fromMin(Math.min(a.e,b.e))}).`});
      }
    }
    const evs=list.filter(x=>x.kind==='event');
    for(let i=1;i<evs.length;i++){
      const a=evs[i-1],b=evs[i];
      if(b.s<a.e) continue;
      if(b.travel>0&&!(a.loc&&b.loc&&a.loc===b.loc)&&((a.loc&&b.loc)||(hasGeo(a)&&hasGeo(b)))){
        const gap=b.s-a.e;
        if(gap<b.travel) out.push({type:'travel',date,a,b,text:`${a.title} slutar ${fromMin(a.e)} och resan till ${b.title} tar ca ${b.travel} min. Du är framme ${fromMin(a.e+b.travel)}, ${dur(a.e+b.travel-b.s)} för sent.`});
      }
    }
  }
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
function conflicts(){if(!cfCache){autoTravel(state);cfCache=detectConflicts(state.events,state.tasks)}return cfCache}
function conflictIds(){const s=new Set();for(const c of conflicts()){s.add(c.a.id);s.add(c.b.id)}return s}

/* ---------- day helpers ---------- */
function dayItems(ds){
  const items=[];
  for(const e of state.events) if(e.date===ds&&e.start&&e.end) items.push({kind:'event',s:toMin(e.start),e:toMin(e.end),ref:e});
  for(const t of state.tasks) if(t.date===ds&&t.start&&t.end) items.push({kind:'task',s:toMin(t.start),e:toMin(t.end),ref:t});
  return items.sort((a,b)=>a.s-b.s||a.e-b.e);
}
function briefFor(ds){
  const now=new Date(),todayS=ymd(now);
  const items=dayItems(ds);
  const evs=items.filter(i=>i.kind==='event');
  const tks=items.filter(i=>i.kind==='task'&&!i.ref.done);
  const isToday=ds===todayS;
  const nowMin=isToday?now.getHours()*60+now.getMinutes():-1;
  const dayWord=isToday?'idag':ds===ymd(addDays(now,1))?'imorgon':`den ${pd(ds).getDate()} ${monLong(pd(ds))}`;
  const tr0=tripsOn(ds)[0],tripLine=tr0?`Du är på resa: ${tr0.title}, dag ${dayDiff(ds,tr0.start)+1} av ${tripDays(tr0)}.`:'';
  if(!items.length) return `Inget inplanerat ${dayWord}.${tripLine?' '+tripLine:''}`;
  const parts=[];
  const tk=tks.length?`${tks.length} ${tks.length>1?'planerade uppgifter':'planerad uppgift'}`:'';
  if(evs.length) parts.push(`Du har ${evs.length} event ${dayWord}${tk?` och ${tk}`:''}.`);
  else parts.push(`Inga event ${dayWord}, men ${tk}.`);
  if(tripLine)parts.push(tripLine);
  const upcoming=evs.filter(e=>e.e>nowMin);
  if(isToday){
    const nx=upcoming.find(e=>e.ref.travel);
    if(nx&&toMin(nx.ref.start)-nx.ref.travel>nowMin) parts.push(`Lämna senast ${fromMin(nx.s-nx.ref.travel)} för att hinna till ${nx.ref.title}.`);
    else if(upcoming[0]) parts.push(`Nästa är ${upcoming[0].ref.title} ${upcoming[0].ref.start}.`);
    else if(evs.length) parts.push('Dagens event är slut.');
  } else if(evs[0]) parts.push(`Första event är ${evs[0].ref.title} ${evs[0].ref.start}.`);
  let best=null;
  for(let i=1;i<items.length;i++){
    const gs=Math.max(...items.slice(0,i).map(x=>x.e)),ge=items[i].s,g=ge-gs;
    if(g>=30&&ge>nowMin&&(!best||g>best.g)) best={g,gs,ge};
  }
  if(best) parts.push(`Längsta lediga tiden är ${dur(best.g)} (${fromMin(best.gs)}–${fromMin(best.ge)}).`);
  const k=conflicts().filter(c=>c.date===ds).length;
  if(k) parts.push(`${k} krock att lösa.`);
  return parts.join(' ');
}

/* ---------- scheduling ---------- */
function busyIntervals(ds,events,tasks,temp){
  const arr=[];
  for(const e of events) if(e.date===ds&&e.start&&e.end) arr.push([toMin(e.start)-(+e.travel||0)-5,toMin(e.end)+5]);
  for(const t of tasks) if(t.date===ds&&t.start&&t.end&&!t.done) arr.push([toMin(t.start)-5,toMin(t.end)+5]);
  for(const t of temp) if(t.date===ds) arr.push([toMin(t.start)-5,toMin(t.end)+5]);
  arr.sort((a,b)=>a[0]-b[0]);
  const m=[];
  for(const iv of arr){ if(m.length&&iv[0]<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],iv[1]); else m.push([iv[0],iv[1]]); }
  return m;
}
function slotIn(busy,lo,hi,dur_,minStart){
  let c=Math.ceil(Math.max(lo,minStart)/5)*5;
  for(const [bs,be] of busy){
    if(be<=c) continue;
    if(bs-c>=dur_&&c+dur_<=hi) return c;
    if(bs<c+dur_) c=Math.max(c,Math.ceil(be/5)*5);
  }
  return c+dur_<=hi?c:null;
}
function findSlot(ds,minutes,ctx,temp,minStart){
  const weekend=((pd(ds).getDay()+6)%7)>=5;
  const windows=weekend?[[10*60,19*60],[8*60,21*60+30]]:[[16*60,20*60+30],[8*60,21*60+30]];
  const busy=busyIntervals(ds,ctx.events,ctx.tasks,temp);
  for(const [lo,hi] of windows){const s=slotIn(busy,lo,hi,minutes,minStart);if(s!=null)return s}
  return null;
}
function schedulePlan(list,eventDate,ctx){
  const now=ctx.now||new Date(),todayS=ymd(now);
  const lastDay=addDays(pd(eventDate),-1);
  let days=[];
  for(let d=pd(todayS);d<=lastDay;d=addDays(d,1)) days.push(ymd(d));
  if(days.length>10) days=days.slice(-10);
  const nowMin=now.getHours()*60+now.getMinutes()+30;
  const temp=[],out=[],n=list.length;
  list.forEach((t,i)=>{
    let placed=null;
    if(days.length){
      const pref=days.length===1?0:Math.round(i*(days.length-1)/Math.max(n-1,1));
      const order=days.map((_,k)=>k).sort((a,b)=>Math.abs(a-pref)-Math.abs(b-pref)||a-b);
      for(const di of order){
        const ds=days[di];
        const s=findSlot(ds,t.minutes,ctx,temp,ds===todayS?nowMin:0);
        if(s!=null){placed={date:ds,start:fromMin(s),end:fromMin(s+t.minutes)};break}
      }
    }
    if(placed){temp.push(placed);out.push({...t,...placed})}
    else out.push({...t,date:null,start:null,end:null});
  });
  return out;
}
function fallbackTasks(ev){
  const topics=(ev.prep&&ev.prep.length?ev.prep:(ev.notes?[ev.notes]:[])).slice(0,5);
  if(!topics.length) return [{title:`Förbered inför ${ev.title}`,minutes:45}];
  const list=topics.map(t=>({title:`Förbered: ${t}`,minutes:40}));
  if(topics.length>=2) list.push({title:`Repetition inför ${ev.title}`,minutes:30});
  return list;
}
/* ---------- places, travel, icons ---------- */
const MODES={walk:{label:'Gå',speed:4.8,base:0},bike:{label:'Cykel',speed:14,base:2},transit:{label:'Kollektivt',speed:22,base:8},car:{label:'Bil',speed:30,base:4}};
const hasGeo=o=>!!o&&Number.isFinite(o.lat)&&Number.isFinite(o.lng);
const hasGuess=o=>!!o&&Number.isFinite(o.glat)&&Number.isFinite(o.glng);
const isEmoji=s=>typeof s==='string'&&s.length>0&&s.length<=14&&/\p{Extended_Pictographic}/u.test(s);
function haversineKm(a,b){
  const t=x=>x*Math.PI/180,dLat=t(b.lat-a.lat),dLng=t(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}
function travelMinutes(a,b,mode){
  const km=haversineKm(a,b)*1.3;
  if(km<0.15) return 0;
  let m=MODES[mode]||MODES.transit;
  if(mode==='transit'&&km<1.2) m=MODES.walk;
  return Math.max(5,Math.ceil((m.base+km/m.speed*60)/5)*5);
}
function originFor(prev,e,st){
  const gap=prev?toMin(e.start)-toMin(prev.end):1e9;
  if(prev&&hasGeo(prev)&&gap<180) return {o:prev,label:prev.location||prev.title};
  if(hasGeo(st.home)) return {o:st.home,label:st.home.label||'Hemma'};
  return null;
}
function autoTravel(st){
  const byDay={};
  for(const e of st.events) if(e.date&&e.start&&e.end) (byDay[e.date]=byDay[e.date]||[]).push(e);
  for(const ds of Object.keys(byDay)){
    const evs=byDay[ds].sort((a,b)=>toMin(a.start)-toMin(b.start));
    let prev=null;
    for(const e of evs){
      if(hasGeo(e)){
        if(!e.travelManual){
          const from=originFor(prev,e,st);
          if(from){e.travel=travelMinutes(from.o,e,st.mode);e.travelFrom=from.label}
          else{e.travel=null;e.travelFrom=''}
        }
        prev=e;
      } else prev=null;
    }
  }
}
const ICON_RULES=[[/plugga|studie|läxa|kapitel|förbered|repetition/i,'📚'],[/prov|tenta|quiz/i,'📝'],[/fysik|kemi|biologi|labb/i,'🔬'],[/matte|matematik/i,'🧮'],[/svenska|engelska|språk/i,'📖'],[/grupparbete|projekt/i,'👥'],[/fotboll|match|träning|innebandy|handboll/i,'⚽'],[/gym|styrke/i,'🏋️'],[/löp|jogg|spring/i,'🏃'],[/simm|simma/i,'🏊'],[/cykel/i,'🚴'],[/tandläk/i,'🦷'],[/läkare|vårdcentral|sjukhus|doktor/i,'🩺'],[/frisör|klippning/i,'💈'],[/lunch|middag|frukost|restaurang/i,'🍽️'],[/fika|kaffe/i,'☕'],[/present|köp|handla|inköp/i,'🎁'],[/födelsedag|kalas|fest/i,'🎂'],[/möte|jobb|arbete|kund/i,'💼'],[/flyg/i,'✈️'],[/tåg/i,'🚆'],[/buss/i,'🚌'],[/resa|åka/i,'🧳'],[/konsert|musik|kör/i,'🎵'],[/bio|film/i,'🎬'],[/städ/i,'🧹']];
function suggestIcon(title){const t=String(title||'');for(const [re,ic] of ICON_RULES) if(re.test(t)) return ic;return ''}
const iconOf=(o,kind)=>(o&&o.icon)||suggestIcon(o&&o.title)||(kind==='task'?'✅':'📅');
function demoHome(){return {label:'Hemma (exempel), Hammarbyhöjden',lat:59.2995,lng:18.1030,geo:'demo',demo:true}}
function migrate(s){
  if(!s.v||s.v<2){
    const hadDemo=s.events.some(e=>e.demo);
    const keep=s.events.filter(e=>!e.demo);
    if(hadDemo){
      const ids=new Set(s.events.filter(e=>e.demo).map(e=>e.id));
      s.tasks=s.tasks.filter(t=>!ids.has(t.eventId));
      s.events=[...demoItems(),...keep];
      if(!s.home) s.home=demoHome();
    }
    s.v=2;
  }
  if(!Array.isArray(s.trips))s.trips=[];
  if(s.v<3){if(s.events.some(e=>e.demo)&&!s.trips.length)s.trips.push(demoTrip());s.v=3}
  s.mode=s.mode||'transit';
  return s;
}
/* ---------- trips (pure helpers) ---------- */
const tripsOf=()=>((typeof state!=='undefined'&&state&&state.trips)||[]);
const tripDays=t=>dayDiff(t.end,t.start)+1;
function tripsOn(ds){return tripsOf().filter(t=>t.start<=ds&&ds<=t.end)}

function extractPrompt(text,hasImage){

  return `You extract calendar information for a Swedish-speaking user and return structured JSON.

Today is ${ymd(now)} (${wdLong(now)}). Timezone: Europe/Stockholm. Weeks start on Monday. Dates use YYYY-MM-DD, times use 24h HH:MM.

Source material:
${hasImage?'- An image (screenshot or photo) is attached. Read all text in it.\n':''}${text?`- Text from the user:\n"""\n${text.slice(0,8000)}\n"""\n`:''}
Rules:
- Find every event (fixed date and time) and task (something to do, usually with a deadline but no fixed time).
- NEVER invent information. If a field is not in the source, use null (or [] for prep). Do not guess an end time, a location or a year that is not stated.
- Resolve relative dates ("på fredag", "nästa vecka") against today's date. If the year is missing, use the next upcoming occurrence.
- If a stated weekday does not match the stated date, keep the date but set that field's confidence to "low" and mention it in "questions".
- "prep" holds what to prepare or bring, exactly as stated (e.g. "Kapitel 4–6"). Only include what the source says.
- "icon" is ONE emoji that fits the item (for example 📝 for a test, ⚽ for training, 🦷 for a dentist), or null.
- "important" is true for tests, exams, deadlines, trips, bookings and anything that needs preparation.
- "confidence" per field is "high", "medium" or "low". "evidence" is a short quote from the source (max 100 characters).
- "questions": at most 2 short Swedish questions, only if something essential is missing or unclear.
- If the source is only a link, you cannot open it. Return no items and ask the user to paste the text.
- Write titles and other text in the source language (usually Swedish).

Reply with ONLY one JSON object, no other text:
{"items":[{"kind":"event"|"task","title":string,"date":string|null,"start":string|null,"end":string|null,"location":string|null,"prep":string[],"important":boolean,"icon":string|null,"confidence":{"date":"high"|"medium"|"low","start":"high"|"medium"|"low","location":"high"|"medium"|"low"},"evidence":string}],"questions":string[]}`;
}
function normExtract(data){
  const todayS=ymd(new Date());
  const raw=Array.isArray(data)?data:(data&&Array.isArray(data.items)?data.items:[]);
  const questions=(data&&Array.isArray(data.questions)?data.questions:[]).filter(q=>typeof q==='string'&&q.trim()).slice(0,3);
  const okD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(pd(s).getTime());
  const normT=s=>{if(typeof s!=='string')return '';const m=s.match(/^(\d{1,2})[:.](\d{2})/);if(!m)return '';const h=+m[1],mi=+m[2];return h<24&&mi<60?`${pad(h)}:${pad(mi)}`:''};
  const items=raw.slice(0,12).map(r=>{
    if(!r||typeof r!=='object') return null;
    const it={id:uid(),include:true,kind:r.kind==='task'?'task':'event',title:String(r.title||'').trim().slice(0,120),
      date:okD(r.date)?r.date:'',start:normT(r.start),end:normT(r.end),location:typeof r.location==='string'?r.location.trim():'',
      prep:Array.isArray(r.prep)?r.prep.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim().slice(0,100)).slice(0,8):[],
      important:!!r.important,icon:isEmoji(r.icon)?String(r.icon).trim():'',conf:(r.confidence&&typeof r.confidence==='object')?r.confidence:{},
      evidence:typeof r.evidence==='string'?r.evidence.slice(0,140):''};
    if(!it.prep.length&&typeof r.notes==='string'&&r.notes.trim()) it.prep=[r.notes.trim().slice(0,100)];
    if(it.end&&it.start&&toMin(it.end)<=toMin(it.start)) it.end='';
    if(it.date&&dayDiff(it.date,todayS)<0) it.conf.date='low';
    if(it.prep.length) it.important=true;
    return it;
  }).filter(it=>it&&it.title);
  return {items,questions};
}

function railHTML(ds){

  if(!items.length) return banners+`<div class="empty"><b>Ledigt</b>Inget inplanerat den här dagen.</div>`;
  const cf=conflictIds();
  const now=new Date(),isToday=ds===ymd(now),nowMin=now.getHours()*60+now.getMinutes();
  let html='<div class="rail">',prevEnd=null,marked=!isToday;
  const mark=()=>`<div class="now"><span>${fromMin(nowMin)}</span></div>`;
  items.forEach(it=>{
    if(!marked&&it.s>nowMin){html+=mark();marked=true}

  });

  return banners+html+'</div>';
}

function weekStrip(sel){

const WS=7*60,WE=22*60,PXH=42;
function weekGrid(sel){
  const start=startOfWeek(sel),days=[...Array(7)].map((_,i)=>addDays(start,i)),todayS=ymd(new Date()),cf=conflictIds();
  const H=(WE-WS)/60*PXH;
  let hours='';for(let h=8;h<22;h++) hours+=`<span style="top:${(h-7)*PXH}px">${pad(h)}</span>`;
  const head=days.map(d=>`<button class="wkh${ymd(d)===todayS?' today':''}" data-act="pickDay" data-d="${ymd(d)}"><span>${wdShort(d)}</span><b>${d.getDate()}</b></button>`).join('');
  const cols=days.map(d=>{
    const ds=ymd(d);
    const blocks=dayItems(ds).map(it=>{
      const s=Math.max(it.s,WS),e=Math.min(it.e,WE);if(e<=s)return '';
      const top=(s-WS)/60*PXH,h=Math.max((e-s)/60*PXH-2,16),isT=it.kind==='task';
      return `<button class="blk ${isT?'tk':''}${cf.has(it.ref.id)?' cf':''}${isT&&it.ref.done?' done':''}" style="top:${top}px;height:${h}px" data-act="${isT?'openTask':'openEvent'}" data-id="${it.ref.id}" aria-label="${esc(it.ref.title)}"><b>${iconOf(it.ref,it.kind)} ${esc(it.ref.title)}</b></button>`;
    }).join('');
    return `<div class="wkc${ds===todayS?' today':''}" style="height:${H}px">${blocks}</div>`;
  }).join('');
  return `<div class="wk"><div class="wk-h"><span></span>${head}</div>${tripRow(days)}<div class="wk-b"><div class="wk-ax" style="height:${H}px">${hours}</div>${cols}</div></div>`;

function wireCapture(){
  const drop=$('#drop'),file=$('#file'),txt=$('#cap-text');
  if(txt) txt.addEventListener('input',()=>{ui.capture.text=txt.value});
  if(file) file.addEventListener('change',()=>{if(file.files&&file.files[0])setFile(file.files[0])});
  if(drop){
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))setFile(f)});
  }

async function runAnalyze(){
  const c=ui.capture,text=(c.text||'').trim();

  ui.sheetRef={type:'analyzing'};
  const ctl=new AbortController();ui.ctl=ctl;
  const t0=Date.now();
  openSheet(`<div class="grab"></div><h2>Läser innehållet</h2><p class="lead" id="an-sub">Det kan ta några sekunder.</p><div class="skel"><i></i><i></i></div><div class="actions"><button class="btn ghost" data-act="cancelAnalyze">Avbryt</button></div>`);
  const tick=setInterval(()=>{const s=$('#an-sub');if(s)s.textContent=`Det kan ta en stund. ${Math.round((Date.now()-t0)/1000)} s`;else clearInterval(tick)},1000);
  try{
    const s=await getSample();if(!s)throw {code:'unavailable'};
    const opts={signal:ctl.signal,cache:false};
    if(c.file)opts.images=c.file;
    const data=await s.json(extractPrompt(text,!!c.file),opts);
    if(ctl.signal.aborted)return;
    const r=normExtract(data);
    ui.pv={items:r.items,questions:r.questions};

    ui.sheetRef={type:'capture'};
    openSheet(captureHTML());wireCapture();
    const note=$('#cap-note');note.hidden=false;note.textContent=errCopy(e);
  }
}

function saveEventForm(form){

  let end=String(f.get('end')||'');

    prep:String(f.get('prep')||'').split('\n').map(x=>x.trim()).filter(Boolean),notes:String(f.get('notes')||'').trim(),important:f.get('important')==='on'};
  let ev;

function placeTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const now=new Date(),todayS=ymd(now),nowMin=now.getHours()*60+now.getMinutes()+30;
  const last=t.due&&dayDiff(t.due,todayS)>=0?t.due:ymd(addDays(now,7));
  const ctx={events:state.events,tasks:state.tasks.filter(x=>x.id!==id)};
  for(let d=pd(todayS);ymd(d)<=last;d=addDays(d,1)){
    const ds=ymd(d),s=findSlot(ds,t.minutes||30,ctx,[],ds===todayS?nowMin:0);
    if(s!=null){t.date=ds;t.start=fromMin(s);t.end=fromMin(s+(t.minutes||30));save();render();toast(`Planerad ${shortDate(ds)} ${t.start}`);return}
  }
  toast('Hittade ingen ledig tid. Prova att välja tid själv.');
}

async function runPlan(){
  const ev=state.events.find(e=>e.id===ui.plan.eventId);if(!ev)return;
  ui.sheetRef={type:'planning'};
  const ctl=new AbortController();ui.ctl=ctl;
  openSheet(`<div class="grab"></div><h2>Planerar inför ${esc(ev.title)}</h2><p class="lead">Jag tittar på vad du ska förbereda och var det finns luft i kalendern.</p><div class="skel"><i></i><i></i></div><div class="actions"><button class="btn ghost" data-act="closeSheet">Avbryt</button></div>`);
  const left=dayDiff(ev.date,ymd(new Date()));
  let list=null;
  try{
    const s=await getSample();
    if(s){
      const budget=Math.max(30,Math.min(left*60,240));
      const prompt=`You help a person prepare for an event. Reply in Swedish.
Event: ${ev.title}, ${ev.date} (${wdLong(pd(ev.date))}) at ${ev.start}. Days left: ${left}.
Things to prepare (as stated by the user): ${ev.prep&&ev.prep.length?ev.prep.join('; '):'(nothing specified)'}${ev.notes?`\nNotes: ${ev.notes}`:''}

      const data=await s.json(prompt,{signal:ctl.signal,cache:false,modelTier:'quick'});
      const arr=data&&Array.isArray(data.tasks)?data.tasks:[];
      list=arr.filter(t=>t&&typeof t.title==='string'&&t.title.trim()).slice(0,6).map(t=>({title:t.title.trim().slice(0,90),minutes:Math.max(10,Math.min(120,Math.round(+t.minutes)||30))}));
      if(!list.length)list=null;
    }
  }catch(e){if(e&&e.code==='cancelled')return}
  if(ctl.signal.aborted)return;
  ui.ctl=null;
  ui.plan.source=list?'ai':'basic';
  if(!list)list=fallbackTasks(ev);

  renderPlan();
}
function renderPlan(){
  const p=ui.plan,ev=state.events.find(e=>e.id===p.eventId);if(!ev)return;
  ui.sheetRef={type:'plan'};
  const left=dayDiff(ev.date,ymd(new Date()));
  const placed=p.tasks.filter(t=>t.date).length,total=p.tasks.length;
  let msg='';
  if(!total) msg='Inga uppgifter kvar i planen.';
  else if(placed===total) msg=`Allt får plats. Sista passet ligger före ${ev.title}.`;
  else if(placed===0) msg='Jag hittade ingen ledig tid före eventet. Uppgifterna sparas under Uppgifter så du kan planera in dem själv.';
  else msg=`Jag fick plats med ${placed} av ${total}. Resten sparas under Uppgifter.`;
  openSheet(`<div class="grab"></div><h2>Plan inför ${esc(ev.title)}</h2><p class="lead">${left} ${left>1?'dagar':'dag'} kvar. ${esc(msg)}${p.source==='basic'?' (Enkel plan, AI var inte tillgänglig.)':''}</p>
  <ul class="plain">${p.tasks.map((t,i)=>`<li class="pl"><div><b>${esc(t.title)}</b><span class="num">${t.date?`${shortDate(t.date)} ${t.start}–${t.end}`:'Ingen ledig tid'}</span></div><button class="x" data-act="planDrop" data-i="${i}" aria-label="Ta bort ${esc(t.title)}">×</button></li>`).join('')}</ul>
  <div class="actions"><button class="btn ghost" data-act="closeSheet">Avbryt</button><button class="btn primary" data-act="planCommit" ${total?'':'disabled'}>${placed?'Lägg in i kalendern':'Spara uppgifter'}</button></div>`);
}
function planCommit(){
  const p=ui.plan,ev=state.events.find(e=>e.id===p.eventId);if(!ev)return;
  const due=ymd(addDays(pd(ev.date),-1));
  for(const t of p.tasks) state.tasks.push({id:uid(),eventId:ev.id,title:t.title,minutes:t.minutes,due,date:t.date,start:t.start,end:t.end,done:false});

const MIC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SUGS=['Vad har jag imorgon?','Har jag något som krockar nästa vecka?','Påminn mig att köpa present till Erik innan lördag','Planera in pluggpass inför fysikprovet','Flytta mitt pluggpass till torsdag'];
function freeSlotsRange(from,to,minutes,now){
  now=now||new Date();
  const todayS=ymd(now),out=[];
  for(let d=pd(from);ymd(d)<=to;d=addDays(d,1)){
    const ds=ymd(d);if(ds<todayS)continue;
    const busy=busyIntervals(ds,state.events,state.tasks,[]);
    let c=Math.ceil(Math.max(8*60,ds===todayS?now.getHours()*60+now.getMinutes()+30:0)/5)*5;const hi=21*60+30;
    for(const [bs,be] of busy){
      if(be<=c)continue;
      if(bs-c>=minutes)out.push({date:ds,s:c,e:Math.min(bs,hi)});
      c=Math.max(c,Math.ceil(be/5)*5);
    }
    if(hi-c>=minutes)out.push({date:ds,s:c,e:hi});
  }
  return out.filter(x=>x.e-x.s>=minutes);
}
function askPrompt(text,canAct){

  const end=ymd(addDays(now,30));

  for(const e of state.events) if(e.date>=ymd(now)&&e.date<=end) items.push({id:e.id,kind:'event',title:e.title,date:e.date,start:e.start,end:e.end,location:e.location||null,prep:e.prep&&e.prep.length?e.prep:undefined});
  for(const t of state.tasks) if(!t.done&&((t.date&&t.date>=ymd(now)&&t.date<=end)||(!t.date))) items.push({id:t.id,kind:'task',title:t.title,date:t.date||null,start:t.start||null,end:t.end||null,due:t.due||null});
  const cf=conflicts().filter(c=>c.date>=ymd(now)&&c.date<=end).map(c=>c.text);
  return `You are the assistant inside a calendar app. Talk to the user in Swedish: brief, calm and concrete (max 3 short sentences unless the user asks for a list).
Now: ${ymd(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}, ${wdLong(now)}. Timezone: Europe/Stockholm. Weeks start on Monday.
Date reference (use it to resolve "på fredag", "nästa vecka" and similar):
${cal}
The user's calendar for the next 30 days (JSON, ids included) and known conflicts:
${JSON.stringify(items).slice(0,20000)}
Conflicts: ${JSON.stringify(cf)}
Trips: ${JSON.stringify((state.trips||[]).map(t=>({id:t.id,title:t.title,start:t.start,end:t.end})))}
${canAct?`You can act with the tools. Only act when the user clearly asks you to add, move, remind or plan something. Never delete anything. Never invent details: if a required detail is missing (for example the time of an event), ask ONE short question instead of guessing. "Remind me to X before Y" becomes a task with a due date, not an event. If the user mentions a plan without a time (like a trip on Friday), save it as a task with that due date and say so. For study or preparation sessions before an event call plan_preparation, so the user can approve the proposed plan. For a trip ("jag ska till Göteborg 12–15 oktober", "i 4 dagar från fredag") call add_trip with the first and the LAST day; if the start or length is unclear, ask one short question. After acting, state in one sentence what you did.`:`You can only read: answer from the calendar data above. If the user asks you to change something, say briefly that changes are not available in this view.`}

User says: ${text}`;
}
function buildTools(changes,setPlan,setTrip){
  const isD=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(pd(v).getTime());
  const isT=v=>typeof v==='string'&&/^\d{1,2}:\d{2}$/.test(v)&&+v.split(':')[0]<24&&+v.split(':')[1]<60;
  const nt=v=>{const [h,m]=v.split(':').map(Number);return fromMin(h*60+m)};
  const find=id=>{const e=state.events.find(x=>x.id===id);if(e)return {kind:'event',ref:e};const t=state.tasks.find(x=>x.id===id);return t?{kind:'task',ref:t}:null};
  const confFor=id=>conflicts().filter(c=>c.a.id===id||c.b.id===id).map(c=>c.text);
  return [
    {name:'list_items',description:'List events and tasks between two dates (inclusive). Returns id, kind, title, date, start, end, location. Use it to look things up or to find an id.',
     inputSchema:{type:'object',properties:{from:{type:'string',description:'YYYY-MM-DD'},to:{type:'string',description:'YYYY-MM-DD'}},required:['from','to']},
     execute(i){
       if(!isD(i.from)||!isD(i.to))throw new Error('from and to must be YYYY-MM-DD');
       const r=[];
       for(const e of state.events) if(e.date>=i.from&&e.date<=i.to) r.push({id:e.id,kind:'event',title:e.title,date:e.date,start:e.start,end:e.end,location:e.location||null});
       for(const t of state.tasks){const d=t.date||t.due;if(d&&d>=i.from&&d<=i.to) r.push({id:t.id,kind:'task',title:t.title,date:t.date||null,start:t.start||null,end:t.end||null,due:t.due||null,done:!!t.done})}
       return r.slice(0,60);
     }},
    {name:'find_free_time',description:'Find free time slots on one day that fit a duration in minutes. Returns a list of {start,end} (HH:MM).',
     inputSchema:{type:'object',properties:{date:{type:'string',description:'YYYY-MM-DD'},minutes:{type:'number'}},required:['date','minutes']},
     execute(i){
       if(!isD(i.date))throw new Error('date must be YYYY-MM-DD');
       const m=Math.max(10,Math.min(480,+i.minutes||30));
       return freeSlotsRange(i.date,i.date,m).slice(0,6).map(x=>({start:fromMin(x.s),end:fromMin(x.e)}));
     }},
    {name:'add_event',description:'Add a calendar event with a fixed date and start time. end is optional (defaults to 60 minutes). Returns id and any conflicts it causes.',
     inputSchema:{type:'object',properties:{title:{type:'string'},date:{type:'string',description:'YYYY-MM-DD'},start:{type:'string',description:'HH:MM'},end:{type:'string',description:'HH:MM, optional'},location:{type:'string'}},required:['title','date','start']},
     execute(i){
       const title=String(i.title||'').trim();
       if(!title||!isD(i.date)||!isT(i.start))throw new Error('title, date (YYYY-MM-DD) and start (HH:MM) are required');
       const start=nt(i.start);let end=isT(i.end)?nt(i.end):'';
       if(!end||toMin(end)<=toMin(start))end=fromMin(Math.min(toMin(start)+60,1439));
       const e={id:uid(),title:title.slice(0,120),date:i.date,start,end,location:String(i.location||'').trim().slice(0,120),notes:'',prep:[],travel:null,important:false};
       state.events.push(e);cfCache=null;
       changes.push(`La till ${e.title}, ${shortDate(e.date)} ${e.start}`);
       return {ok:true,id:e.id,conflicts:confFor(e.id)};
     }},
    {name:'add_task',description:'Add a task / reminder, optionally with a due date. It is not placed at a time in the calendar.',
     inputSchema:{type:'object',properties:{title:{type:'string'},due:{type:'string',description:'YYYY-MM-DD, optional'},minutes:{type:'number'}},required:['title']},
     execute(i){
       const title=String(i.title||'').trim();if(!title)throw new Error('title is required');
       const t={id:uid(),eventId:null,title:title.slice(0,120),minutes:Math.max(5,Math.min(240,+i.minutes||30)),due:isD(i.due)?i.due:null,date:null,start:null,end:null,done:false};
       state.tasks.push(t);cfCache=null;
       changes.push(`Ny uppgift: ${t.title}${t.due?` (senast ${shortDate(t.due)})`:''}`);
       return {ok:true,id:t.id};
     }},
    {name:'move_item',description:'Move an existing event or scheduled task to a new date and/or start time, keeping its duration. Provide the id from list_items.',
     inputSchema:{type:'object',properties:{id:{type:'string'},date:{type:'string',description:'YYYY-MM-DD'},start:{type:'string',description:'HH:MM, optional (keeps current start if omitted)'}},required:['id','date']},
     execute(i){
       const it=find(String(i.id));if(!it)throw new Error('No item with that id');
       if(!isD(i.date))throw new Error('date must be YYYY-MM-DD');
       const r=it.ref,start=isT(i.start)?nt(i.start):r.start;
       if(!start)throw new Error('This item has no start time; provide start (HH:MM)');
       const len=r.start&&r.end?toMin(r.end)-toMin(r.start):(r.minutes||30);
       r.date=i.date;r.start=start;r.end=fromMin(Math.min(toMin(start)+len,1439));cfCache=null;
       if(r.sid)pushSharedEvent(r);
       changes.push(`Flyttade ${r.title} till ${shortDate(r.date)} ${r.start}`);
       return {ok:true,conflicts:confFor(r.id)};
     }},
    {name:'plan_preparation',description:'Open a proposed preparation plan (study sessions / tasks placed in free time) for an upcoming event, for the user to approve. Provide the event id.',
     inputSchema:{type:'object',properties:{event_id:{type:'string'}},required:['event_id']},
     execute(i){
       const e=state.events.find(x=>x.id===String(i.event_id));if(!e)throw new Error('No event with that id');
       if(dayDiff(e.date,ymd(new Date()))<1)throw new Error('The event is today or in the past');

     }},
    {name:'add_trip',description:'Add a trip (several days away). start and end are dates; end is the LAST day of the trip (inclusive). Returns existing calendar items that clash with the trip.',
     inputSchema:{type:'object',properties:{title:{type:'string',description:'Destination or name, e.g. Göteborg'},start:{type:'string',description:'YYYY-MM-DD'},end:{type:'string',description:'YYYY-MM-DD, last day inclusive'}},required:['title','start','end']},
     execute(i){
       const title=String(i.title||'').trim();
       if(!title||!isD(i.start)||!isD(i.end)||i.end<i.start)throw new Error('title, start and end (YYYY-MM-DD, end not before start) are required');
       if(dayDiff(i.end,i.start)>60)throw new Error('A trip can be at most 60 days');
       const t={id:uid(),title:title.slice(0,80),start:i.start,end:i.end,code:null,owner:true};
       state.trips.push(t);cfCache=null;setTrip(t.id);
       changes.push(`Ny resa: ${t.title}, ${tripLabelDate(t)}`);
       return {ok:true,id:t.id,clashes:tripClashes(t).slice(0,10).map(c=>`${c.ref.date} ${c.ref.title}`)};
     }}
  ];
}

${freeTxt}

${people.slice(0,3000)}
"""

  try{
    const data=await s.json(prompt,{cache:false});

const validLL=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0);
async function geocodeBatch(list){
  const s=await getSample();if(!s)throw {code:'unavailable'};
  const hint=hasGeo(state.home)?`The user lives near "${state.home.label}" (${state.home.lat.toFixed(3)}, ${state.home.lng.toFixed(3)}). Prefer places near there when a name is ambiguous.`:'';
  const prompt=`Estimate WGS84 coordinates for places that appear in a personal calendar. ${hint}
Places (JSON): ${JSON.stringify(list)}
Rules: give coordinates ONLY for places you actually know (a landmark, station, venue, named school, street address). For vague or private names (a bare room number, "hemma", "skolan" without a name) return null. Never guess. "confidence" is "high" only when you are confident the point is within about 300 m, otherwise "low".
Reply with ONLY JSON: {"places":[{"key":string,"lat":number|null,"lng":number|null,"confidence":"high"|"low"}]}`;
  const data=await s.json(prompt,{cache:false});
  return data&&Array.isArray(data.places)?data.places:[];
}
async function ensureGeo(){
  const todo=[];
  for(const o of [...state.events,...state.tasks]) if(o.location&&!hasGeo(o)&&!hasGuess(o)&&!o.geoTried) todo.push(o);
  if(!todo.length)return 0;
  const labels=[...new Set(todo.map(o=>o.location.trim()))].slice(0,12);
  const res=await geocodeBatch(labels.map(l=>({key:l,label:l})));
  const byKey=new Map(res.map(r=>[r&&r.key,r]));
  let n=0;
  for(const o of todo){
    const l=o.location.trim();if(!labels.includes(l))continue;
    o.geoTried=true;
    const r=byKey.get(l);
    if(r&&validLL(+r.lat,+r.lng)){
      if(r.confidence==='high'){o.lat=+r.lat;o.lng=+r.lng;o.geo='ai';n++}
      else{o.glat=+r.lat;o.glng=+r.lng}
    }
  }
  save();render();
  if(n)toast(n===1?'Hittade en plats på kartan':`Hittade ${n} platser på kartan`);
  return n;
}

Reply with ONLY JSON: {"label":string,"lat":number|null,"lng":number|null,"confidence":"high"|"medium"|"low"}`,{cache:false});

function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(12),c=globalThis.crypto;if(c&&c.getRandomValues)c.getRandomValues(b);else for(let i=0;i<12;i++)b[i]=Math.floor(Math.random()*256);return [...b].map(x=>A[x%32]).join('')}

function mirrorEvents(code,docs){
  const ids=new Set();let changed=false;
  for(const d of docs){
    const r=d.data()||{};
    if(typeof r.title!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||!/^\d{1,2}:\d{2}$/.test(r.start||'')||!/^\d{1,2}:\d{2}$/.test(r.end||''))continue;
    ids.add(d.id);
    const f={title:r.title.slice(0,120),date:r.date,start:r.start,end:r.end,location:typeof r.location==='string'?r.location:'',icon:isEmoji(r.icon)?r.icon:''};
    if(validLL(+r.lat,+r.lng)){f.lat=+r.lat;f.lng=+r.lng}
    const e=state.events.find(x=>x.sid===d.id&&x.tripCode===code);
    if(!e){state.events.push({id:uid(),sid:d.id,tripCode:code,prep:[],notes:'',travel:null,important:false,...f});changed=true}
    else if(Object.keys(f).some(k=>e[k]!==f[k])){Object.assign(e,f);changed=true}
  }
  const before=state.events.length;
  state.events=state.events.filter(e=>!(e.tripCode===code&&e.sid&&!ids.has(e.sid)));
  if(state.events.length!==before)changed=true;
  if(changed){save();renderSoft();const sr=ui.sheetRef;if(sr&&sr.type==='trip'&&sr.code===code){/* clash list may change */}}
}

  if(code.length!==12){toast('Koden ska ha 12 tecken.');return}
  if(!DB||!acct.uid){toast('Du måste vara inloggad för att gå med.');return}
  if(state.trips.some(t=>t.code===code)){toast('Du är redan med i den resan.');return}
  let snap;try{snap=await DB.doc(`trips/${code}/info/main`).get()}catch(e){toast('Kunde inte kontrollera koden just nu.');return}
  const r=snap.exists?snap.data():null;
  if(!r||!/^\d{4}-\d{2}-\d{2}$/.test(r.start||'')||!/^\d{4}-\d{2}-\d{2}$/.test(r.end||'')){toast('Hittade ingen resa med den koden.');return}
  try{await DB.doc(`trips/${code}/members/${acct.uid}`).set({at:Date.now()})}catch(e){toast('Du får inte gå med. Du behöver redigeringsrätt till appen.');return}
  const t={id:uid(),title:String(r.title||'Resa').slice(0,80),start:r.start,end:r.end,code,owner:false};
  state.trips.push(t);save();subscribeTrip(code);closeSheet();render();openTrip(t.id);
}
function openTrip(id){
  const t=(state.trips||[]).find(x=>x.id===id);if(!t)return;
  ui.sheetRef={type:'trip',id,code:t.code||null};
  const today=ymd(new Date()),left=dayDiff(t.start,today);
  const active=left<=0&&dayDiff(t.end,today)>=0,over=dayDiff(today,t.end)>1;
  const when=left>0?`om ${left} ${left>1?'dagar':'dag'}`:active?`pågår, dag ${dayDiff(today,t.start)+1} av ${tripDays(t)}`:'avslutad';
  const clashes=tripClashes(t),owner=!t.code||t.owner;
  const clashHTML=clashes.length?`<div class="alert"><div><b>${clashes.length} ${clashes.length>1?'saker':'sak'} i din kalender under resan</b><p>Flytta eller ta bort dem, eller behåll dem om du hinner.</p><div class="sugs" style="margin:8px 0 0">${clashes.slice(0,8).map(c=>`<button class="sug" data-act="${c.kind==='event'?'openEvent':'openTask'}" data-id="${c.ref.id}">${esc(shortDate(c.ref.date))} ${esc(trunc(c.ref.title,18))}</button>`).join('')}</div></div></div>`:'';
  let share='';
  if(t.code&&!(DB&&acct.uid)) share=`<div class="note">Logga in på claude.ai för att se gruppen och chatten.</div>`;
  else if(t.code){
    share=`<h3 style="margin:16px 0 8px">Deltagare</h3><div id="trip-members" class="who-row" style="flex-wrap:wrap"></div>
    <div class="grp" style="margin:14px 0;box-shadow:none;background:var(--bg)"><h3>Bjud in</h3><p class="about" style="margin-bottom:8px">Kod: <b class="num">${fmtCode(t.code)}</b></p><textarea id="inv-text" readonly style="min-height:96px">${esc(inviteText(t))}</textarea><div style="margin-top:8px"><button class="btn soft sm" data-act="copyInvite" data-id="${id}">Kopiera inbjudan</button></div><p class="cap">Personen måste kunna öppna appen med redigeringsrätt (dela appen via Dela-menyn i Claude). Den som har koden kan gå med.</p></div>
    <h3 style="margin:16px 0 8px">Uppgifter</h3><div id="trip-tasks"></div>${over?'':`<form id="ttf" data-code="${t.code}" class="askrow" style="margin-top:8px"><input name="title" placeholder="Ny uppgift, t.ex. Boka tåg" autocomplete="off" aria-label="Ny uppgift"><select name="who" id="tt-who" aria-label="Ansvarig" style="width:auto;max-width:40%"></select><button class="btn soft" type="submit">Lägg till</button></form>`}
    <h3 style="margin:18px 0 8px">Chatt</h3><div id="trip-chat" class="chat" aria-live="polite"></div>${over?'<p class="cap">Resan är slut, så chatten är skrivskyddad här.</p>':`<form id="tcf" data-code="${t.code}" class="askrow" style="margin-top:8px"><input name="text" placeholder="Skriv ett meddelande" autocomplete="off" aria-label="Meddelande" enterkeyhint="send"><button class="btn primary" type="submit">Skicka</button></form>`}`;
  }else share=`<div class="grp" style="margin:14px 0;box-shadow:none;background:var(--bg)"><h3>Gruppchatt</h3><p class="about">Skapa en gruppchatt för resan: dela ut uppgifter, prata ihop er och ha en gemensam kalender under resan.</p><button class="btn primary sm" data-act="tripOffer" data-id="${id}" style="margin-top:8px">Skapa gruppchatt</button></div>`;
  openSheet(`<div class="grab"></div><h2>✈️ ${esc(t.title)}</h2><p class="lead">${tripLabelDate(t)}, ${tripDays(t)} dagar, ${when}</p>${clashHTML}${share}<div class="actions">${t.code&&DB?`<button class="btn soft" data-act="addTripEvent" data-id="${id}">Lägg till i resans kalender</button>`:''}${owner?`<button class="btn soft" data-act="editTrip" data-id="${id}">Redigera</button>`:''}<button class="btn danger" data-act="delTrip" data-id="${id}">${t.code&&!t.owner?'Lämna resan':(t.code?'Avsluta resan':'Ta bort')}</button></div>`);
  if(t.code&&DB){subscribeTrip(t.code);ui.chatFirst=true;renderTripParts(t.code)}
}
async function renderTripParts(code){
  const t=state.trips.find(x=>x.code===code),S=shared[code];if(!t||!S)return;
  const open=()=>ui.sheetRef&&ui.sheetRef.type==='trip'&&ui.sheetRef.code===code;
  if(!open())return;
  const ids=[...new Set([...S.members,...S.msgs.map(m=>m.by),...S.tasks.map(x=>x.assignee)].filter(Boolean))];
  let ps={};try{ps=USER?await USER.profiles(ids):{}}catch(e){}
  if(!open())return;
  const nm=id=>(ps[id]&&ps[id].name)||'Någon';
  const isMe=id=>id===acct.uid||!!(ps[id]&&ps[id].isMe);
  const mem=$('#trip-members');
  if(mem)mem.innerHTML=S.members.length?S.members.map(id=>`<span class="chipw"><img class="av sm" src="${esc(ps[id]?ps[id].avatarUrl:'')}" alt="">${esc(isMe(id)?'Du':nm(id))}</span>`).join(''):'<span class="cap" style="margin:0">Ansluter…</span>';
  const tk=$('#trip-tasks');
  if(tk)tk.innerHTML=S.tasks.length?S.tasks.map(x=>`<div class="tl${x.done?' done':''}"><button class="chk" data-act="ttToggle" data-id="${esc(x.id)}" aria-label="${x.done?'Markera som ej klar':'Markera som klar'}" style="color:var(--on-accent)">${x.done?ICON.check:''}</button><div class="main"><div class="ttl" style="font-size:16px">${esc(x.title)}</div><div class="sub">${x.assignee?'Ansvarig: '+esc(isMe(x.assignee)?'du':nm(x.assignee)):'Ingen ansvarig än'}</div></div><button class="x" data-act="ttDel" data-id="${esc(x.id)}" aria-label="Ta bort uppgift">×</button></div>`).join(''):'<p class="cap" style="margin:0">Inga uppgifter än.</p>';
  const sel=$('#tt-who');
  if(sel){const cur=sel.value;sel.innerHTML='<option value="">Ingen ansvarig</option>'+S.members.map(id=>`<option value="${esc(id)}">${esc(isMe(id)?'Jag':nm(id))}</option>`).join('');sel.value=cur}
  const chat=$('#trip-chat');
  if(chat){
    let last='';
    const html=S.msgs.map(m=>{
      const d=new Date(m.at||0),day=ymd(d);let sep='';
      if(day!==last){last=day;sep=`<div class="msg-day">${day===ymd(new Date())?'Idag':shortDate(day)}</div>`}
      const me=isMe(m.by);
      return sep+`<div class="msg${me?' me':''}">${me?'':`<span class="mn">${esc(nm(m.by))}</span>`}<p>${esc(m.text)}</p><time>${pad(d.getHours())}:${pad(d.getMinutes())}</time></div>`;
    }).join('')||'<p class="cap" style="margin:0">Inga meddelanden än. Säg hej!</p>';
    const atBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<80||ui.chatFirst;
    chat.innerHTML=html;
    if(atBottom)chat.scrollTop=chat.scrollHeight;
    ui.chatFirst=false;
  }
}

/* ---------- actions ---------- */
const handlers={
  newTrip(){openTripForm(null)},
  joinTrip(){openJoin()},
  openTrip(el){openTrip(el.dataset.id)},
  tripOffer(el){openTripOffer(el.dataset.id)},
  startShare(el){el.disabled=true;startShare(el.dataset.id)},
  editTrip(el){const t=state.trips.find(x=>x.id===el.dataset.id);if(t)openTripForm(t)},
  addTripEvent(el){const t=state.trips.find(x=>x.id===el.dataset.id);if(t)openEventForm(null,{date:t.start,trip:t.code})},
  copyInvite(el){
    const t=state.trips.find(x=>x.id===el.dataset.id);if(!t)return;
    const fb=()=>{const a=$('#inv-text');if(a){a.focus();a.select()}toast('Markera texten och kopiera')};
    try{navigator.clipboard.writeText(inviteText(t)).then(()=>toast('Inbjudan kopierad'),fb)}catch(e){fb()}
  },
  delTrip(el){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tryck igen';return}
    const t=state.trips.find(x=>x.id===el.dataset.id);if(!t)return;
    if(t.code&&DB){
      if(t.owner)DB.doc(`trips/${t.code}/info/main`).delete().catch(()=>{});
      else if(acct.uid)DB.doc(`trips/${t.code}/members/${acct.uid}`).delete().catch(()=>{});
      state.events=state.events.filter(e=>e.tripCode!==t.code);
      unsubTrip(t.code);
    }
    state.trips=state.trips.filter(x=>x.id!==t.id);save();closeSheet();render();toast('Borttaget');
  },
  ttToggle(el){const c=ui.sheetRef&&ui.sheetRef.code,S=c&&shared[c];if(!S||!DB)return;const x=S.tasks.find(k=>k.id===el.dataset.id);if(x)DB.doc(`trips/${c}/tasks/${x.id}`).update({done:!x.done}).catch(()=>toast('Kunde inte uppdatera.'))},
  ttDel(el){const c=ui.sheetRef&&ui.sheetRef.code;if(c&&DB)DB.doc(`trips/${c}/tasks/${el.dataset.id}`).delete().catch(()=>toast('Kunde inte ta bort.'))},
  pickIcon(el){
    const form=el.closest('form'),inp=form&&form.querySelector('[name=icon]');if(!inp)return;
    inp.value=inp.value===el.dataset.e?'':el.dataset.e;
    $$('[data-act=pickIcon]',form).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.e===inp.value)));
  },
  findHome(){findHome()},
  setMode(el){state.mode=el.dataset.k;save();render()},
  ask(){openAsk()},
  sug(el){const i=$('#ask-in');if(i)i.value=el.dataset.t;runAsk(el.dataset.t)},
  mic(){toggleMic()},
  undoAsk(){if(!ui.undo)return;const b=JSON.parse(ui.undo);state.events=b.events;state.tasks=b.tasks;ui.undo=null;save();render();const o=$('#ask-out');if(o)o.innerHTML='<div class="ans"><p>Ångrat.</p></div>';toast('Ångrat')},
  aiBrief(){aiBrief()},
  group(){openGroup()},
  grpAdd(el){
    const p=ui.grp&&ui.grp.proposals[+el.dataset.i];if(!p)return;
    state.events.push({id:uid(),title:ui.grp.title,date:p.date,start:p.start,end:p.end,location:'',notes:'',prep:[],travel:null,important:false});
    save();render();el.disabled=true;el.textContent='Inlagd';toast('Inlagd i kalendern');
  },
  tab(el){ui.tab=el.dataset.tab;render();window.scrollTo(0,0)},
  plus(){ui.capture={file:null,thumb:'',text:''};openCapture()},
  closeSheet(){closeSheet()},
  dismissWelcome(){state.seenWelcome=true;save();render()},
  pickFile(){const f=$('#file');if(f)f.click()},
  clearFile(){ui.capture.file=null;ui.capture.thumb='';openSheet(captureHTML());wireCapture()},
  example(){ui.capture.text='Fysikprov nästa fredag kl 08:15 i sal 204. Kapitel 4–6. Ta med miniräknare.';openSheet(captureHTML());wireCapture()},
  analyze(){runAnalyze()},
  cancelAnalyze(){if(ui.ctl){try{ui.ctl.abort()}catch(e){}ui.ctl=null}ui.sheetRef={type:'capture'};openSheet(captureHTML());wireCapture()},
  backCapture(){openSheet(captureHTML());ui.sheetRef={type:'capture'};wireCapture()},
  manual(){openEventForm(null)},
  pvKind(el){syncPv();const it=ui.pv.items[+el.dataset.i];if(it){it.kind=el.dataset.k;renderPreview()}},
  pvCommit(){pvCommit()},
  openEvent(el){openEvent(el.dataset.id)},
  editEvent(el){const e=state.events.find(x=>x.id===el.dataset.id);if(e)openEventForm(e)},
  delEvent(el){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tryck igen för att ta bort';return}
    const id=el.dataset.id;const dead=state.events.find(e=>e.id===id);if(dead&&dead.sid&&dead.tripCode&&DB)DB.doc(`trips/${dead.tripCode}/events/${dead.sid}`).delete().catch(()=>{});state.events=state.events.filter(e=>e.id!==id);state.tasks=state.tasks.filter(t=>t.eventId!==id);
    save();closeSheet();render();toast('Borttaget');
  },
  openTask(el){openTask(el.dataset.id)},
  delTask(el){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tryck igen';return}
    state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id);save();closeSheet();render();
  },
  toggleTask(el){const t=state.tasks.find(x=>x.id===el.dataset.id);if(t){t.done=!t.done;afterChange()}},
  placeTask(el){placeTask(el.dataset.id)},
  qaAdd(){const i=$('#qa');const v=i&&i.value.trim();if(!v)return;state.tasks.push({id:uid(),eventId:null,title:v,minutes:30,due:null,date:null,start:null,end:null,done:false});save();render();const n=$('#qa');if(n)n.focus()},
  planEvent(el){openPlan(el.dataset.id)},
  planGo(){runPlan()},
  planDrop(el){ui.plan.tasks.splice(+el.dataset.i,1);renderPlan()},
  planCommit(){planCommit()},
  mode(el){ui.mode=el.dataset.k;render()},
  nav(el){const n=+el.dataset.n,step=ui.mode==='week'?7:1;ui.sel=ymd(addDays(pd(ui.sel),n*step));render()},
  goToday(){ui.sel=ymd(new Date());render()},
  selDay(el){ui.sel=el.dataset.d;render()},
  pickDay(el){ui.sel=el.dataset.d;ui.mode='day';render()},
  theme(el){state.theme=el.dataset.k;save();applyTheme();render()},
  clearDemo(){const ids=new Set(state.events.filter(e=>e.demo).map(e=>e.id));state.events=state.events.filter(e=>!e.demo);state.tasks=state.tasks.filter(t=>!ids.has(t.eventId));if(state.home&&state.home.demo)state.home=null;state.trips=(state.trips||[]).filter(t=>!t.demo);save();render();toast('Exempeldata borttagen')},
  addDemo(){state.events.push(...demoItems());if(!state.home)state.home=demoHome();if(!(state.trips||[]).some(t=>t.demo))state.trips.push(demoTrip());save();render()},
  wipe(el){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Tryck igen för att rensa allt';return}
    unsubAll();state.events=[];state.tasks=[];state.trips=[];state.seenWelcome=true;save();render();toast('Allt rensat');
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=handlers[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet').classList.contains('on')){closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='qa'){e.preventDefault();handlers.qaAdd()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='evf')saveEventForm(e.target);
  else if(e.target.id==='tkf')saveTaskForm(e.target);
  else if(e.target.id==='askf'){const i=$('#ask-in');if(i)runAsk(i.value)}
  else if(e.target.id==='grpf')runGroup(e.target);
  else if(e.target.id==='tripf')saveTripForm(e.target);
  else if(e.target.id==='joinf')joinTrip(new FormData(e.target).get('code'));
  else if(e.target.id==='ttf'){
    const f=new FormData(e.target),title=String(f.get('title')||'').trim(),code=e.target.dataset.code;
    if(!title||!DB)return;
    DB.collection(`trips/${code}/tasks`).add({title:title.slice(0,120),assignee:String(f.get('who')||'')||null,done:false,by:acct.uid||null,at:Date.now()}).catch(()=>toast('Kunde inte lägga till.'));
    const i=e.target.querySelector('[name=title]');if(i)i.value='';
  }
  else if(e.target.id==='tcf'){
    const f=new FormData(e.target),text=String(f.get('text')||'').trim(),code=e.target.dataset.code;
    if(!text||!DB)return;
    DB.collection(`trips/${code}/msgs`).add({by:acct.uid||null,text:text.slice(0,500),at:Date.now()}).catch(()=>toast('Kunde inte skicka.'));
    const i=e.target.querySelector('[name=text]');if(i){i.value='';i.focus()}
  }
});
document.addEventListener('change',e=>{
  if(e.target.closest&&e.target.closest('#tripf')){const f=e.target.closest('#tripf'),a=f.querySelector('[name=start]').value,b=f.querySelector('[name=end]').value,L=$('#tr-len');if(L&&a&&b)L.textContent=b<a?'Sista dagen ligger före första dagen':`${dayDiff(b,a)+1} dagar`}
  const card=e.target.closest&&e.target.closest('.pv');
  if(card&&ui.pv&&ui.sheetRef&&ui.sheetRef.type==='preview'){
    syncPv();
    const it=ui.pv.items[+card.dataset.i];
    const w=$('.pv-warn',card);if(w&&it)w.textContent=pvWarnings(it).join(' ');
    if(e.target.dataset.f==='include'){card.classList.toggle('off',!it.include);const go=$('#pv-go'),n=ui.pv.items.filter(i=>i.include).length;if(go)go.textContent=`Lägg till${n?` (${n})`:''}`}
  }
});
document.addEventListener('paste',e=>{
  if(!ui.sheetRef||ui.sheetRef.type!=='capture')return;
  const files=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files[0]){e.preventDefault();setFile(files[0])}
});

applyTheme();
render();
getSample();
initAccount();
</script>
